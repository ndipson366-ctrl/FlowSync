<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync - Assignment Workflow</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --text-color: #333333;
            --active-bg: #d1e7dd;
            --active-text: #0f5132;
            --active-border: #198754;
            --btn-primary: #0d6efd;
            --btn-hover: #0b5ed7;
            --btn-secondary: #6c757d;
            --btn-secondary-hover: #5c636a;
            --border-color: #ced4da;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --active-bg: #2d3730;
            --active-text: #4caf50;
            --active-border: #4caf50;
            --btn-secondary: #333333;
            --btn-secondary-hover: #444444;
            --border-color: #444444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* Fullscreen immersive styles */
        :fullscreen {
            background-color: var(--container-bg);
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            padding: 2.3rem !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Top Header layout (Persistent across views) */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        /* Icon Button Styles */
        .icon-btn {
            background-color: var(--btn-secondary);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            transition: background-color 0.15s ease-in-out;
        }

        .icon-btn:hover {
            background-color: var(--btn-secondary-hover);
        }

        .icon-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        /* Views */
        #input-view {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #display-view {
            display: none;
            flex-direction: column;
            gap: 1rem;
            flex-grow: 1;
        }
        
        #settings-view {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 1rem;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--container-bg);
            color: var(--text-color);
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .help-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin: 0;
        }

        .progress-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--active-border);
            width: 0%;
            transition: width 0.3s ease;
        }

        #bullet-container {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .bullet {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            border-left: 4px solid transparent;
            border-radius: 0 4px 4px 0;
            color: var(--text-color);
            opacity: 0.7;
        }

        .bullet.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border-left: 4px solid var(--active-border);
            font-weight: 500;
            opacity: 1;
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--btn-primary);
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
        }

        .btn-primary:hover {
            background-color: var(--btn-hover);
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--bg-color);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        
        <!-- Persistent Top Header -->
        <div class="top-header">
            <h1>FlowSync</h1>
            <div class="button-group">
                <button id="settings-btn" class="Icon-btn" title="Settings">
                    <img src="Images/Settings_Icon.png" alt="Settings">
                </button>
                <button id="fullscreen-btn" class="Icon-btn" title="Fullscreen">
                    <img src="Images/Fullscreen_Icon.png" alt="Fullscreen">
                </button>
                <button id="edit-btn" class="icon-btn" title="Edit / Reset">
                    <img src="Images/Edit_Icon.png" alt="Edit">
                </button>
            </div>
        </div>

        <!-- Text Input View -->
        <div id="input-view">
            <p class="help-text">Paste your assignment steps or workflow notes below. Each line will become a separate step.</p>
            <textarea id="text-input" placeholder="Paste your assignment steps here...&#10;Step 1: Research topic&#10;Step 2: Draft outline&#10;Step 3: Write introduction"></textarea>
            <button id="start-btn" class="btn-primary">Start Workflow</button>
        </div>

        <!-- Practice Display View -->
        <div id="display-view">
            <p class="help-text"><strong>Navigation:</strong> Space / ↓ / → (Next) | ↑ / ← (Previous) | <strong>Exit:</strong> ESC</p>
            
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <ul id="bullet-container">
                <!-- Steps injected here via JS -->
            </ul>
        </div>
        
        <!-- Settings View -->
        <div id="settings-view">
            <h2>Settings</h2>
            
            <div class="settings-row">
                <span style="font-weight: 500;">Appearance</span>
                <button id="theme-toggle-btn" class="btn-primary" style="align-self: center;">Switch to Dark Mode</button>
            </div>
            
            <button id="close-settings-btn" class="btn-primary" style="background-color: var(--btn-secondary);">Back</button>
        </div>

    </div>

    <script>
        const inputView = document.getElementById('input-view');
        const displayView = document.getElementById('display-view');
        const settingsView = document.getElementById('settings-view');
        
        const textInput = document.getElementById('text-input');
        const startBtn = document.getElementById('start-btn');
        const editBtn = document.getElementById('edit-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        
        const bulletContainer = document.getElementById('bullet-container');
        const progressBar = document.getElementById('progress-bar');
        const mainContainer = document.getElementById('main-container');

        let bullets = [];
        let currentIndex = 0;
        let isPracticing = false;

        // Settings Toggle Logic
        settingsBtn.addEventListener('click', () => {
            inputView.style.display = 'none';
            displayView.style.display = 'none';
            settingsView.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsView.style.display = 'none';
            if (isPracticing) {
                displayView.style.display = 'flex';
            } else {
                inputView.style.display = 'flex';
            }
        });

        // Dark Mode Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = 'Switch to Light Mode';
            } else {
                themeToggleBtn.textContent = 'Switch to Dark Mode';
            }
        });

        // Start Workflow
        startBtn.addEventListener('click', () => {
            const rawText = textInput.value;
            
            bullets = rawText.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (bullets.length === 0) {
                alert('Please enter some steps before starting.');
                return;
            }

            currentIndex = 0;
            isPracticing = true;

            renderBullets();
            inputView.style.display = 'none';
            settingsView.style.display = 'none';
            displayView.style.display = 'flex';
        });

        // Edit / Reset Button
        editBtn.addEventListener('click', () => {
            isPracticing = false;
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            
            displayView.style.display = 'none';
            settingsView.style.display = 'none';
            inputView.style.display = 'flex';
            textInput.focus();
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                mainContainer.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Render List
        function renderBullets() {
            bulletContainer.innerHTML = ''; 

			bullets.forEach((text, index) => {
                const li = document.createElement('li');
                li.className = 'bullet';
                li.textContent = text;
                li.id = `bullet-${index}`;
                bulletContainer.appendChild(li);
            });

            updateHighlight();
        }

        // Update Green State & Progress
        function updateHighlight() {
            const allBullets = document.querySelectorAll('.bullet');
            allBullets.forEach(bullet => bullet.classList.remove('active'));

            const activeBullet = document.getElementById(`bullet-${currentIndex}`);
            if (activeBullet) {
                activeBullet.classList.add('active');
                activeBullet.scrollIntoView({ behavior: 'auto', block: 'center' });
            }

            const progressPercentage = ((currentIndex + 1) / bullets.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!isPracticing || settingsView.style.display === 'flex') return;

            if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowRight') {
                e.preventDefault();
                if (currentIndex < bullets.length - 1) {
                    currentIndex++;
                    updateHighlight();
                }
            }
            
            if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    updateHighlight();
                }
            }
        });
    </script>
</body>
</html>
