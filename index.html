<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --textarea-bg: #ffffff;
            --text-color: #333333;
            --active-bg: #d1e7dd;
            --active-text: #0f5132;
            --active-border: #198754;
            --btn-primary: #0d6efd;
            --btn-hover: #0b5ed7;
            --btn-secondary: #6c757d;
            --btn-secondary-hover: #5c636a;
            --border-color: #ced4da;
            --settings-btn-bg: #1a73e8;
            --settings-btn-hover: #1557b0;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg-color: #0d0d0d;
            --container-bg: #161616;
            --textarea-bg: #222222;
            --text-color: #ffffff;
            --active-bg: #2d3730;
            --active-text: #4caf50;
            --active-border: #4caf50;
            --btn-secondary: #333333;
            --btn-secondary-hover: #444444;
            --border-color: #333333;
            --settings-btn-bg: #2b7cff; 
            --settings-btn-hover: #1e5cbf;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* Fullscreen immersive styles */
        :fullscreen {
            background-color: var(--container-bg);
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            padding: 2.3rem !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background-color: var(--btn-secondary);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            transition: background-color 0.15s ease-in-out;
        }

        .icon-btn:hover {
            background-color: var(--btn-secondary-hover);
        }

        .icon-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        #input-view {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #display-view {
            display: none;
            flex-direction: column;
            gap: 1rem;
            flex-grow: 1;
        }
        
        #settings-view {
            display: none;
            flex-direction: column;
            gap: 2rem;
            padding: 1rem 0;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 1rem;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .help-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin: 0;
        }

        .progress-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--active-border);
            width: 0%;
            transition: width 0.3s ease;
        }

        #bullet-container {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .bullet {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            border-left: 4px solid transparent;
            border-radius: 0 4px 4px 0;
            color: var(--text-color);
            opacity: 0.7;
        }

        .bullet.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border-left: 4px solid var(--active-border);
            font-weight: 500;
            opacity: 1;
        }

        .btn-primary {
            background-color: var(--btn-primary);
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
        }

        .btn-primary:hover {
            background-color: var(--btn-hover);
        }

        .settings-header {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
        }

        .settings-label {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn-settings {
            background-color: var(--settings-btn-bg);
            color: white;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-settings:hover {
            background-color: var(--settings-btn-hover);
        }

        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            background-color: var(--container-bg);
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            z-index: 1000;
            overflow: hidden;
            flex-direction: column;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            color: var(--text-color);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .dropdown-item:hover {
            background-color: var(--active-bg);
            color: var(--active-text);
        }

        body.theme-ocean {
            --bg-color: #e0f2fe;
            --container-bg: #ffffff;
            --textarea-bg: #ffffff;
            --text-color: #0c4a6e;
            --active-bg: #bae6fd;
            --active-text: #0369a1;
            --active-border: #0284c7;
            --btn-primary: #0284c7;
            --btn-hover: #0369a1;
            --settings-btn-bg: #0ea5e9;
            --settings-btn-hover: #0284c7;
            --border-color: #bae6fd;
        }

        body.theme-sunset {
            --bg-color: #fff1f2;
            --container-bg: #ffffff;
            --textarea-bg: #ffffff;
            --text-color: #4c0519;
            --active-bg: #fecdd3;
            --active-text: #be123c;
            --active-border: #e11d48;
            --btn-primary: #e11d48;
            --btn-hover: #be123c;
            --settings-btn-bg: #f43f5e;
            --settings-btn-hover: #e11d48;
            --border-color: #fecdd3;
        }

        body.theme-forest {
            --bg-color: #ecfdf5;
            --container-bg: #ffffff;
            --textarea-bg: #ffffff;
            --text-color: #064e3b;
            --active-bg: #a7f3d0;
            --active-text: #047857;
            --active-border: #059669;
            --btn-primary: #059669;
            --btn-hover: #047857;
            --settings-btn-bg: #10b981;
            --settings-btn-hover: #059669;
            --border-color: #a7f3d0;
        }

        body.theme-ocean.dark-mode {
            --bg-color: #082f49;
            --container-bg: #0c4a6e;
            --textarea-bg: #10587d;
            --text-color: #f0f9ff;
            --active-bg: #0369a1;
            --active-text: #bae6fd;
            --active-border: #38bdf8;
            --btn-primary: #0284c7;
            --btn-hover: #0ea5e9;
            --settings-btn-bg: #0ea5e9;
            --settings-btn-hover: #0284c7;
            --border-color: #0369a1;
            --btn-secondary: #1e3a8a;
            --btn-secondary-hover: #1e40af;
        }

        body.theme-sunset.dark-mode {
            --bg-color: #4c0519;
            --container-bg: #881337;
            --textarea-bg: #9f1239;
            --text-color: #fff1f2;
            --active-bg: #be123c;
            --active-text: #fecdd3;
            --active-border: #fb7185;
            --btn-primary: #e11d48;
            --btn-hover: #f43f5e;
            --settings-btn-bg: #f43f5e;
            --settings-btn-hover: #e11d48;
            --border-color: #be123c;
            --btn-secondary: #831843;
            --btn-secondary-hover: #9f1239;
        }

        body.theme-forest.dark-mode {
            --bg-color: #064e3b;
            --container-bg: #065f46;
            --textarea-bg: #047857;
            --text-color: #ecfdf5;
            --active-bg: #047857;
            --active-text: #a7f3d0;
            --active-border: #34d399;
            --btn-primary: #059669;
            --btn-hover: #10b981;
            --settings-btn-bg: #10b981;
            --settings-btn-hover: #059669;
            --border-color: #047857;
            --btn-secondary: #064e3b;
            --btn-secondary-hover: #065f46;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        
        <!-- Persistent Top Header -->
        <div class="top-header">
            <h1>FlowSync</h1>
            <div class="button-group">
                <button id="settings-btn" class="icon-btn" title="Settings">
                    <img src="Images/Settings_icon.png" alt="Settings">
                </button>
                <button id="fullscreen-btn" class="icon-btn" title="Fullscreen">
                    <img src="Images/Fullscreen_icon.png" alt="Fullscreen">
                </button>
                <button id="edit-btn" class="icon-btn" title="Edit / Reset">
                    <img src="Images/Edit_Icon.png" alt="Edit">
                </button>
            </div>
        </div>

        <!-- Text Input View -->
        <div id="input-view">
            <p class="help-text">Paste your assignment steps or workflow notes below. Each line will become a separate step.</p>
            <textarea id="text-input" placeholder="Paste your assignment steps here...&#10;Step 1: Research topic&#10;Step 2: Draft outline&#10;Step 3: Write introduction"></textarea>
            <button id="start-btn" class="btn-primary">Start Workflow</button>
        </div>

        <!-- Practice Display View -->
        <div id="display-view">
            <p class="help-text"><strong>Navigation:</strong> Space / ↓ / → (Next) | ↑ / ← (Previous) | <strong>Exit:</strong> ESC</p>
            
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <ul id="bullet-container">
                <!-- Steps injected here via JS -->
            </ul>
        </div>
        
        <!-- Modern Settings View -->
        <div id="settings-view">
            <div>
                <div class="settings-header">Settings</div>
                
                <div class="settings-row">
                    <span class="settings-label">Appearance</span>
                    <button id="theme-toggle-btn" class="btn-settings">Switch to Dark Mode</button>
                </div>

                <div class="settings-row">
                    <span class="settings-label">Theme</span>
                    <div class="dropdown-container">
                        <button id="theme-select-btn" class="btn-settings">Select a Theme ▼</button>
                        <div id="theme-dropdown-menu" class="dropdown-menu">
                            <div class="dropdown-item" data-theme="default">Default</div>
                            <div class="dropdown-item" data-theme="ocean">Ocean Breeze</div>
                            <div class="dropdown-item" data-theme="sunset">Sunset Glow</div>
                            <div class="dropdown-item" data-theme="forest">Forest Canopy</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="close-settings-btn" class="btn-primary" style="background-color: var(--btn-secondary); margin-top: auto;">Back</button>
        </div>

    </div>

    <script>
        const inputView = document.getElementById('input-view');
        const displayView = document.getElementById('display-view');
        const settingsView = document.getElementById('settings-view');
        
        const textInput = document.getElementById('text-input');
        const startBtn = document.getElementById('start-btn');
        const editBtn = document.getElementById('edit-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        
        const themeSelectBtn = document.getElementById('theme-select-btn');
        const themeDropdownMenu = document.getElementById('theme-dropdown-menu');
        const themeItems = document.querySelectorAll('.dropdown-item');

        const bulletContainer = document.getElementById('bullet-container');
        const progressBar = document.getElementById('progress-bar');
        const mainContainer = document.getElementById('main-container');

        let bullets = [];
        let currentIndex = 0;
        let isPracticing = false;

        // Settings Toggle Logic
        settingsBtn.addEventListener('click', () => {
            inputView.style.display = 'none';
            displayView.style.display = 'none';
            settingsView.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsView.style.display = 'none';
            if (isPracticing) {
                displayView.style.display = 'flex';
            } else {
                inputView.style.display = 'flex';
            }
        });

        // Dark Mode Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = 'Switch to Light Mode';
            } else {
                themeToggleBtn.textContent = 'Switch to Dark Mode';
            }
        });

        // Theme Dropdown Toggle Logic
        themeSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            themeDropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!themeDropdownMenu.contains(e.target) && e.target !== themeSelectBtn) {
                themeDropdownMenu.classList.remove('show');
            }
        });

        // Handle Theme Selection from Dropdown
        themeItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const selectedTheme = e.target.getAttribute('data-theme');
                
                document.body.classList.remove('theme-ocean', 'theme-sunset', 'theme-forest');
                
                if (selectedTheme !== 'default') {
                    document.body.classList.add(`theme-${selectedTheme}`);
                }

                themeSelectBtn.textContent = e.target.textContent + ' ▼';
                themeDropdownMenu.classList.remove('show');
            });
        });

        // Start Workflow
        startBtn.addEventListener('click', () => {
            const rawText = textInput.value;
            
            bullets = rawText.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (bullets.length === 0) {
                alert('Please enter some steps before starting.');
                return;
            }

            currentIndex = 0;
            isPracticing = true;

            renderBullets();
            inputView.style.display = 'none';
            settingsView.style.display = 'none';
            displayView.style.display = 'flex';
        });

        // Edit / Reset Button
        editBtn.addEventListener('click', () => {
            isPracticing = false;
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            
            displayView.style.display = 'none';
            settingsView.style.display = 'none';
            inputView.style.display = 'flex';
            textInput.focus();
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                mainContainer.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Render List
        function renderBullets() {
            bulletContainer.innerHTML = ''; 

            bullets.forEach((text, index) => {
                const li = document.createElement('li');
                li.className = 'bullet';
                li.textContent = text;
                li.id = `bullet-${index}`;
                bulletContainer.appendChild(li);
            });

            updateHighlight();
        }

        // Update Green State & Progress
        function updateHighlight() {
            const allBullets = document.querySelectorAll('.bullet');
            allBullets.forEach(bullet => bullet.classList.remove('active'));

            const activeBullet = document.getElementById(`bullet-${currentIndex}`);
            if (activeBullet) {
                activeBullet.classList.add('active');
                activeBullet.scrollIntoView({ behavior: 'auto', block: 'center' });
            }

            const progressPercentage = ((currentIndex + 1) / bullets.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!isPracticing || settingsView.style.display === 'flex') return;

            if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowRight') {
                e.preventDefault();
                if (currentIndex < bullets.length - 1) {
                    currentIndex++;
                    updateHighlight();
                }
            }
            
            if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    updateHighlight();
                }
            }
        });
    </script>
</body>
</html>
